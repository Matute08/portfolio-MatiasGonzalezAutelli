<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B081A"/>
      <stop offset="100%" stop-color="#1a0e3a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Subtle inner glow -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="none" stroke="url(#borderGrad)" stroke-width="1" opacity="0.5"/>

  <!-- M letter -->
  <text x="140" y="310" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="260" font-weight="700" fill="url(#textGrad)" filter="url(#glow)" text-anchor="middle" dominant-baseline="central" letter-spacing="-8">M</text>

  <!-- G letter -->
  <text x="355" y="310" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="220" font-weight="300" fill="url(#textGrad)" filter="url(#glow)" text-anchor="middle" dominant-baseline="central" letter-spacing="-4">G</text>

  <!-- Subtle accent dot -->
  <circle cx="370" cy="210" r="6" fill="#3B82F6" opacity="0.6"/>
</svg>
